<div  id="po" (mousemove)="updateTooltipPosition($event)"
(mouseenter)="showTooltip($event, pro.description)" 
(mouseleave)="hideTooltip()"
(click)="hideTooltip()"
>
    <a href="/product/{{pro.id}}"><img src="{{pro.urlImg}}" id="pho"></a> 
<label class="ui-like">
    <input type="checkbox" [(ngModel)]="chek" (change)="Like()">
    <span class="like">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill=""><g stroke-width="0" id="SVGRepo_bgCarrier"></g><g stroke-linejoin="round" stroke-linecap="round" id="SVGRepo_tracerCarrier"></g><g id="SVGRepo_iconCarrier"><path d="M20.808,11.079C19.829,16.132,12,20.5,12,20.5s-7.829-4.368-8.808-9.421C2.227,6.1,5.066,3.5,8,3.5a4.444,4.444,0,0,1,4,2,4.444,4.444,0,0,1,4-2C18.934,3.5,21.773,6.1,20.808,11.079Z"></path></g></svg>
       </span>
  </label>
    <p id="F"><a href="/product/{{pro.id}}" id="fofo">{{pro.name}}</a></p>
    <button id="buy" *ngIf="!addBool" (click)=" hideTooltip() ; addBool = !addBool "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000" class="svg1"><path d="M280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM246-720l96 200h280l110-200H246Zm-38-80h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Zm134 280h280-280Z"/></svg></button> 
    <span class="d" *ngIf="addBool">
        <input type="number" class="cam" [(ngModel)]="beg" min="1" max="{{pro.pieces}}">
        <button class="add" (click)="Add() ; addBool = !addBool "><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000" class="svg"><path d="M440-600v-120H320v-80h120v-120h80v120h120v80H520v120h-80ZM280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM40-800v-80h131l170 360h280l156-280h91L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68.5-39t-1.5-79l54-98-144-304H40Z"/></svg></button>
    </span>
    <h6 id="pri">{{pro.priz}} DA</h6>
    
   <div id="tooltip" *ngIf="tooltipVisible" [ngStyle]="tooltipPosition">
      <span class="tooltext">{{pro.description}} </span>
    </div>
</div>
<script>
  const element = document.getElementsByClassName('fofo');
  const Tooltip = document.getElementsByClassName('tooltip');
  const satr = 50;
  const max = 18;
  
  if(element.textContent.length > max){
      element.textContent = element.textContent.slice(0,max - 3) + '...';
  }

  if(Tooltip.textContent.length > satr){
    Tooltip.textContent = Tooltip.textContent.slice(0,satr - 3) + '...';
  }
</script>
